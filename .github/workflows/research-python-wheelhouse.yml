name: Research Python Wheelhouse

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/research-python-wheelhouse.yml
  push:
    branches:
      - main
    paths:
      - .github/workflows/research-python-wheelhouse.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Download pinned research dependencies
        run: |
          mkdir wheelhouse
          python -m pip download \
            --only-binary=:all: \
            --dest wheelhouse \
            "UnityPy==1.25.3" \
            "TypeTreeGeneratorAPI==0.0.10"

      - name: Record hashes
        run: |
          cd wheelhouse
          sha256sum * | sort > SHA256SUMS.txt

      - name: Upload wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: research-python-wheelhouse-py313-linux-x64
          path: wheelhouse/
          retention-days: 1
          if-no-files-found: error
